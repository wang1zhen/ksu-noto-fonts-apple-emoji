name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Static Check & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          python3 -m pip install fonttools

      - name: Run ShellCheck on scripts
        run: |
          shellcheck -s sh \
            module/customize.sh \
            module/tools/fontconfig.sh \
            scripts/*.sh \
            tests/run.sh

      - name: Run unit tests
        run: python3 -I -m unittest discover -s tests -k TestV200FontSettings -v
