name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Static Check & Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ShellCheck and BusyBox
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck busybox

      - name: Run ShellCheck on delivered scripts
        run: |
          shellcheck -s sh \
            module/customize.sh \
            module/tools/fontconfig.sh \
            scripts/build.sh \
            scripts/verify_zip.sh \
            tests/run.sh

      - name: Run fixture and simulated install tests
        run: sh tests/run.sh
